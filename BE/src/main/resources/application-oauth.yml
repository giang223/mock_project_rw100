app:
  auth:
    oauth:
      enabled: true
      redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
      facebook:
        client-id: ${FACEBOOK_CLIENT_ID}
        client-secret: ${FACEBOOK_CLIENT_SECRET}
        graph-version: ${FACEBOOK_GRAPH_VERSION:v27.0}
