name: BE CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "BE/**"
      - "docs/backend/**"
      - "docker-compose.yml"
      - ".github/workflows/be-ci.yml"
  pull_request:
    paths:
      - "BE/**"
      - "docs/backend/**"
      - "docker-compose.yml"
      - ".github/workflows/be-ci.yml"

permissions:
  contents: read

concurrency:
  group: be-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: minisocial_ci
          MYSQL_USER: minisocial
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: "jdbc:mysql://127.0.0.1:3306/minisocial_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: minisocial
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-change-before-any-real-deployment-123456789
      RUN_DB_INTEGRATION: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: BE/pom.xml
      - name: Verify BE and MySQL migrations
        working-directory: BE
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: be-test-reports-${{ github.run_id }}
          path: |
            BE/target/surefire-reports/**/*.xml
            BE/target/failsafe-reports/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build container image
        run: docker build --tag minisocial-be:${{ github.sha }} BE
      - name: Smoke test container against CI MySQL
        run: |
          docker run --detach --name minisocial-be-ci --network host \
            --env SPRING_PROFILES_ACTIVE=prod \
            --env DB_URL --env DB_USERNAME --env DB_PASSWORD --env JWT_SECRET \
            --env FRONTEND_URL=http://localhost:5173 \
            --env CORS_ALLOWED_ORIGINS \
            --env SMTP_HOST=127.0.0.1 --env SMTP_PORT=1025 \
            --env SMTP_USERNAME=ci --env SMTP_PASSWORD=ci \
            --env MAIL_FROM=noreply@example.invalid \
            --env CLOUDINARY_CLOUD_NAME=ci --env CLOUDINARY_API_KEY=ci \
            --env CLOUDINARY_API_SECRET=ci \
            minisocial-be:${{ github.sha }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness > /dev/null; then
              health_status=$(docker inspect --format='{{.State.Health.Status}}' minisocial-be-ci)
              if [ "$health_status" = "healthy" ]; then
                echo "Readiness endpoint and Docker health check are healthy."
                exit 0
              fi
            fi
            sleep 2
          done
          docker logs minisocial-be-ci
          exit 1
      - name: Clean up smoke-test container
        if: always()
        run: docker rm --force minisocial-be-ci 2>/dev/null || true
