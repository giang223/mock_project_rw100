services:
  mysql:
    profiles: ["docker-db"]
    image: mysql:8.4
    container_name: minisocial-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minisocial_db
      MYSQL_USER: minisocial
      MYSQL_PASSWORD: ${DB_PASSWORD:-minisocial_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - minisocial-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: minisocial-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    profiles: ["docker-db"]
    build:
      context: ./BE
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/minisocial_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: minisocial
      DB_PASSWORD: ${DB_PASSWORD:-minisocial_dev_password}
      JWT_SECRET: ${JWT_SECRET:-mini-social-local-development-secret-change-this}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-noreply@minisocial.local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

volumes:
  minisocial-mysql-data:
